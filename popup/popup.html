<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Dark Video</title>
  <!-- No external font requests — uses system-ui for AMO compliance -->
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">

    <!-- Header -->
    <div class="header">
      <div class="logo">
        <span class="logo-icon">🌙</span>
        <div class="logo-text">
          <span class="logo-title">YT Dark Video</span>
          <span class="logo-sub">Smart dark mode for YouTube</span>
        </div>
      </div>
    </div>

    <!-- Main Toggle -->
    <div class="toggle-card" id="mainCard">
      <div class="toggle-info">
        <span class="toggle-icon" id="toggleIcon">☀️</span>
        <div class="toggle-text">
          <span class="toggle-title" id="toggleTitle">Dark Mode Off</span>
          <span class="toggle-desc" id="toggleDesc">White backgrounds on video</span>
        </div>
      </div>
      <label class="switch" aria-label="Toggle dark video">
        <input type="checkbox" id="mainToggle" />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Smart mode badge -->
    <div class="smart-banner" id="smartBanner">
      <div class="smart-banner-left">
        <span class="smart-pulse"></span>
        <span class="smart-label">Smart Mode Active</span>
      </div>
      <span class="smart-desc">Only whites inverted · People untouched</span>
    </div>

    <!-- Presets -->
    <div class="section-label">Filter Presets</div>
    <div class="presets">

      <!-- Smart (new default, spans full row) -->
      <button class="preset-btn preset-smart active" data-preset="smart" id="preset-smart">
        <span class="preset-icon">✨</span>
        <div class="preset-text">
          <span class="preset-name">Smart</span>
          <span class="preset-hint">Whites only</span>
        </div>
        <span class="preset-badge">NEW</span>
      </button>

      <!-- Warm smart -->
      <button class="preset-btn preset-warm" data-preset="warm" id="preset-warm">
        <span class="preset-icon">🕯️</span>
        <div class="preset-text">
          <span class="preset-name">Warm</span>
          <span class="preset-hint">Amber tint</span>
        </div>
      </button>

      <!-- Full invert -->
      <button class="preset-btn" data-preset="invert" id="preset-invert">
        <span class="preset-icon">🔄</span>
        <div class="preset-text">
          <span class="preset-name">Full</span>
          <span class="preset-hint">All inverted</span>
        </div>
      </button>

      <!-- Matrix -->
      <button class="preset-btn" data-preset="green" id="preset-green">
        <span class="preset-icon">💚</span>
        <div class="preset-text">
          <span class="preset-name">Matrix</span>
          <span class="preset-hint">Green tint</span>
        </div>
      </button>

      <!-- Cool -->
      <button class="preset-btn" data-preset="blue" id="preset-blue">
        <span class="preset-icon">🔵</span>
        <div class="preset-text">
          <span class="preset-name">Cool</span>
          <span class="preset-hint">Blue tint</span>
        </div>
      </button>

    </div>

    <!-- Shortcut hint -->
    <div class="shortcut-hint">
      <span class="shortcut-key">Alt</span>
      <span class="shortcut-plus">+</span>
      <span class="shortcut-key">D</span>
      <span class="shortcut-text">to toggle on YouTube</span>
    </div>

    <!-- Footer -->
    <div class="footer">
      Works on YouTube • Slides, tutorials &amp; whiteboards
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
